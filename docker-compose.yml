services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramax -d ramax"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      POSTGRES_DB: ramax
      POSTGRES_USER: ramax
      POSTGRES_PASSWORD: ramax
    ports:
      - "5433:5432"
    volumes:
      - ramax_postgres:/var/lib/postgresql/data

volumes:
  ramax_postgres:
